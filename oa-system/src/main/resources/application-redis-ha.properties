# ══════════════════════════════════════════════════════════════
# Redis 高可用（哨兵）profile
#
# 启用方式：
#   1) 先起演练集群：deploy/redis/start-ha.ps1
#   2) ./mvnw spring-boot:run -Dspring-boot.run.arguments="--spring.profiles.active=redis-ha"
#
# 为什么单独成 profile 而不是直接改 application.properties：
#   本地开发多数时候只需要一个单机 Redis（甚至不启动，走降级）。
#   把哨兵做成默认配置，会让「只想跑后端」的人被迫先搭集群，属于把运维复杂度外包给开发者。
#
# 注意：一旦设置了 sentinel.master，Spring Boot 会改用哨兵解析地址，
#       application.properties 里的 host/port 不再参与连接（保留只为兼容旧环境变量）。
# ══════════════════════════════════════════════════════════════

spring.data.redis.sentinel.master=${REDIS_SENTINEL_MASTER:oastem-master}
spring.data.redis.sentinel.nodes=${REDIS_SENTINEL_NODES:127.0.0.1:26381,127.0.0.1:26382,127.0.0.1:26383}

# 哨兵模式下 database 仍需显式指定（哨兵只负责找主，不改变库号语义）
spring.data.redis.database=${REDIS_DATABASE:0}

# 切换窗口内连接会短暂失败：超时保持 3s，让降级判定快速生效，而不是把请求挂住
spring.data.redis.timeout=3s
spring.data.redis.connect-timeout=3s
