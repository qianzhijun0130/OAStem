spring.application.name=oa-system

# =============================
# 环境配置
# =============================
# local 配置存放敏感信息（DB 密码、JWT 密钥），文件已加入 .gitignore
spring.profiles.active=local

# =============================
# 数据源配置（MySQL 8 / oa_system）
# =============================
# 注意：不要写 characterEncoding=utf8mb4，Connector/J 9.x 会报
# "Unsupported character encoding 'utf8mb4'"；驱动默认即 utf8mb4。
# connectionCollation 与建表时的 utf8mb4_unicode_ci 保持一致，避免连接级排序规则错位。
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/oa_system?serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&connectionCollation=utf8mb4_unicode_ci
spring.datasource.username=${DB_USERNAME:root}
# 真实密码放在 application-local.properties（已加入 .gitignore），避免密钥进入版本库
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP 连接池
spring.datasource.hikari.pool-name=OaSystemHikariPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1

# =============================
# 服务器配置
# =============================
server.port=8080

# =============================
# Redis 配置（Lettuce）
# =============================
# 用途：① JWT 登出黑名单（无状态令牌的唯一补强点）② 字典数据缓存 ③ 登录失败限流
# 本地为 Windows 版 Redis 3.0（D:/Program Files/Redis），无密码，因此不写 password 项：
#   Lettuce 对空串密码仍会发送 AUTH，Redis 3.0 未设 requirepass 时直接报
#   "ERR Client sent AUTH, but no password is set"，连接会失败。
# 需要密码时改用环境变量注入：spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}
# 命令/连接超时统一 3s：Redis 故障时必须快速失败并降级到数据库，不能拖住请求
spring.data.redis.timeout=3s
spring.data.redis.connect-timeout=3s
spring.data.redis.lettuce.shutdown-timeout=200ms

# Redis 不可用时的行为：不阻断启动、业务降级到数据库（见 RedisGuard）。
# 关掉后 Redis 连不上会直接启动失败，适合"Redis 是硬依赖"的部署环境。
redis.fail-fast=false

# 字典缓存有效期（秒）：字典改动少，10 分钟足够；增删改会主动清除对应 key
redis.cache.dict-ttl-seconds=600

# 登录失败限流：同一账号在窗口期内允许的失败次数与锁定时长（秒）
security.login.max-failures=5
security.login.failure-window-seconds=300
security.login.lock-seconds=300

# =============================
# 文件存储配置
# =============================
# 存储实现：local（本地磁盘）/ oss / minio。
# 换云存储时只需新增一个 FileStorageService 实现类并改这里，业务代码不动。
file.storage-type=${FILE_STORAGE_TYPE:local}
# 存储根目录：与环境相关的一切都收敛在这一行。数据库只存相对路径，换目录无需迁移数据。
file.base-path=${FILE_BASE_PATH:F:/GitHub/OAStem/storage/files}
# 静态资源访问前缀（头像等公开图片走这里），需与 SecurityConfig 的放行路径一致
file.access-prefix=/uploads
# 单文件大小上限（MB），应不超过下方 multipart 的限制
file.max-size-mb=10

# multipart 上传限制：max-file-size 限制单个文件，max-request-size 限制整个请求（多文件合计）
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# =============================
# 流程引擎 Flowable 8 配置
# =============================
# 1) 开发环境自动建表（首次启动在 oa_system 库生成 ACT_/FLW_ 流程表）；
#    生产环境应置 false 并改用独立 SQL 脚本管理表结构，避免每次启动变更表结构。
flowable.database-schema-update=true
# 2) 关闭 Flowable 内建 IDM 引擎，审批人直接复用本项目 RBAC（oa_user / oa_role），
#    不另建 Flowable 自己的用户/组表。
flowable.idm.enabled=false
# 3) 基础审批流无定时器/异步延续节点，关闭异步执行器，减少后台线程、启动日志更干净。
#    后续若引入定时提醒/异步任务，再改为 true。
flowable.async-executor-activate=false
# 4) 历史级别 full：已办列表、审批历史时间轴需要完整历史记录与流程变量。
flowable.history-level=full
# 5) 关闭 Flowable 自带的资源目录自动部署（默认 classpath*:/processes/）。
#    内置流程改由 FlowBootstrapRunner 统一注册：既部署引擎、又写入 oa_flow_definition 业务表；
#    若两者都开，同一份 BPMN 会被部署两次、生成重复的流程定义版本。
flowable.check-process-definitions=false

# =============================
# 权限码启动期严格校验（对标 RuoYi Office 严格模式）
# =============================
# 总开关：启动期扫描全部 @PreAuthorize 声明的权限码/角色码，与 oa_menu.menu_code / oa_role.role_code 比对，
# 缺失的码对任何人都将永远 403（含超管），提前暴露"拼写错/漏登记菜单"类静默缺陷。
permission.validation.enabled=true
# 缺失码是否中止启动：默认 false（仅以 ERROR 告警，不阻断启动）；显式 true 进入严格模式（对标 RuoYi Office，启动即暴露并阻断）。
permission.validation.fail-on-missing=
# 豁免码（逗号分隔）：确属有意为之、不入库的权限码可放这里，避免误报。
permission.validation.exclude-codes=

# =============================
# 菜单完整性启动期校验（孤儿菜单清理的自动化手段）
# =============================
# 启动期检查：断裂父引用、悬挂角色菜单引用、未被任何角色引用的菜单、超管是否覆盖全部菜单。仅报告不改动。
menu.integrity-check.enabled=true
# 启动期把超管(SUPER_ADMIN)角色的菜单关联补齐为全部菜单（只增不删、幂等、可回滚）；关掉则仅由上方校验器告警。
menu.super-admin.auto-sync=true

# =============================
# 数据权限使用启动期校验（防"标注 @DataScope 却忘了过滤"的越权隐患）
# =============================
datascope.validator.enabled=true

# =============================
# 流程节点超时（阶段四）：节点未单独配置 timeoutHours 时的默认小时数
# 0 表示不启用；单节点可在流程设计器的「审批人配置」里覆盖
# =============================
approval.timeout.hours=48
